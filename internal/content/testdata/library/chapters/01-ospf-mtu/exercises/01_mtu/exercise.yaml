id: 01_mtu
title: 修复 OSPF 邻居卡在 ExStart
type: config-fix
timeout: 30s
files:
  - source: frr1/frr.conf
    node: r1
    dest: /etc/frr/frr.conf
reload:
  - node: r1
    cmd: "vtysh -c 'clear ip ospf process'"
hints:
  - check the MTU
assertions:
  - name: OSPF 邻居达到 Full
    type: exec
    layer: control-plane
    node: r1
    cmd: 'vtysh -c "show ip ospf neighbor json"'
    match:
      json: "$.neighbors.*.state"
      equals: "Full"
    hint: 检查两侧 MTU。
