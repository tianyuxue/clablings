name: Bug report
description: Report a problem with clablings
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do not include secrets or
        private lab data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `clablings watch --root ...`
        2. Press ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: clablings version
      description: Output of `clablings version`, or the release/commit.
    validations:
      required: true
  - type: input
    id: exercise
    attributes:
      label: Chapter or exercise
      description: For example `02-stp/01_fix_root`, if the issue is content-specific.
    validations:
      required: false
  - type: input
    id: containerlab-version
    attributes:
      label: containerlab version
      description: Output of `containerlab version`.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/distro, kernel, Go version, Docker version, terminal.
    validations:
      required: true
  - type: dropdown
    id: privileges
    attributes:
      label: How are you running it?
      options:
        - As a normal user (docker group, containerlab without SUID)
        - As a normal user with containerlab SUID
        - With sudo
        - Other (explain below)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste verification output, `clablings` errors, or command output.
      render: shell
    validations:
      required: false
