name: 错误报告
description: 报告 clablings 的问题
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交错误报告。请不要包含密钥或私有实验数据。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 清晰、简洁地描述问题。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行 `clablings watch --root ...`
        2. 按下……
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: clablings version
      description: Output of `clablings version`, or the release/commit.
    validations:
      required: true
  - type: input
    id: exercise
    attributes:
      label: Chapter or exercise
      description: For example `02-stp/01_fix_root`, if the issue is content-specific.
    validations:
      required: false
  - type: input
    id: containerlab-version
    attributes:
      label: containerlab version
      description: Output of `containerlab version`.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS/distro, kernel, Go version, Docker version, terminal.
    validations:
      required: true
  - type: dropdown
    id: privileges
    attributes:
      label: How are you running it?
      options:
        - As a normal user (docker group, containerlab without SUID)
        - As a normal user with containerlab SUID
        - With sudo
        - Other (explain below)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste verification output, `clablings` errors, or command output.
      render: shell
    validations:
      required: false
