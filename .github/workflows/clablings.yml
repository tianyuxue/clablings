name: clablings

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/clablings ./cmd/clablings
      - name: Static check
        run: |
          file /tmp/clablings
          ldd /tmp/clablings 2>&1 || true

  integration:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Preflight
        run: |
          docker info
          containerlab version
          docker image inspect alpine:3.20
          docker image inspect gcc:13
      - name: Integration
        run: sudo go test -tags integration ./... -count=1 -timeout 1800s
